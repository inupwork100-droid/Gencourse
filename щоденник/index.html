<title>Щоденник зростання</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: one narrow phone column, sticky profile header, cards per section, fixed bottom tab bar. */
:root {
  --bg: #f2f4fa;
  --surface: #ffffff;
  --surface-2: #f7f8fc;
  --ink: #1a2140;
  --muted: #646d8c;
  --line: #e0e4f0;
  --accent: #3550d6;
  --accent-ink: #ffffff;
  --accent-soft: #e6eaff;
  --m1: #d9455f;
  --m2: #ef7d2d;
  --m3: #e9b024;
  --m4: #84bf3c;
  --m5: #2aa876;
  --empty: #d5dae8;
  --good: #1f9a6a;
  --bad: #d23f58;
  --shadow: 0 1px 2px rgba(26,33,64,.06), 0 6px 20px rgba(26,33,64,.06);
  --f-display: "Unbounded", "Manrope", system-ui, sans-serif;
  --f-body: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r: 18px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1222; --surface: #171c31; --surface-2: #1d2340; --ink: #e8ebf8; --muted: #9ba3c2;
    --line: #2a3152; --accent: #8396ff; --accent-ink: #0e1222; --accent-soft: #252d58;
    --m1: #f0607a; --m2: #f59248; --m3: #f2c341; --m4: #9dd457; --m5: #3cc28d; --empty: #2e3556;
    --good: #45c992; --bad: #f2667f; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1222; --surface: #171c31; --surface-2: #1d2340; --ink: #e8ebf8; --muted: #9ba3c2;
  --line: #2a3152; --accent: #8396ff; --accent-ink: #0e1222; --accent-soft: #252d58;
  --m1: #f0607a; --m2: #f59248; --m3: #f2c341; --m4: #9dd457; --m5: #3cc28d; --empty: #2e3556;
  --good: #45c992; --bad: #f2667f; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.45; -webkit-tap-highlight-color: transparent; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 560px; margin: 0 auto; padding-inline: 16px; padding-block: 0 110px; }

/* header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 12px 10px; display: flex; align-items: center; gap: 10px; }
.brand { font-family: var(--f-display); font-weight: 700; font-size: 15px; letter-spacing: -.01em; margin-right: auto; white-space: nowrap; }
.profiles { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
.pchip { display: flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 12px 5px 6px; font-weight: 700; font-size: 14px; white-space: nowrap; }
.pchip .av { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); font-size: 15px; }
.pchip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.pchip[aria-pressed="true"] .av { background: rgba(255,255,255,.25); }

.banner { background: var(--accent-soft); border-radius: 14px; padding: 10px 12px; font-size: 13px; display: flex; gap: 10px; align-items: center; margin-bottom: 12px; }
.banner p { margin: 0; flex: 1; min-width: 0; }

/* cards */
.stack { display: grid; gap: 14px; }
.card { background: var(--surface); border-radius: var(--r); padding: 16px; box-shadow: var(--shadow); min-width: 0; }
.card h2 { font-family: var(--f-display); font-weight: 500; font-size: 15px; margin: 0; letter-spacing: -.01em; text-wrap: balance; }
.card-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 12px; }
.meta { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.eyebrow { font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

/* date nav */
.datenav { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; }
.datenav .label { flex: 1; text-align: center; min-width: 0; }
.datenav .label b { display: block; font-family: var(--f-display); font-weight: 700; font-size: 19px; letter-spacing: -.02em; text-wrap: balance; }
.datenav .label span { color: var(--muted); font-size: 13px; }
.iconbtn { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; flex: none; }
.iconbtn:disabled { opacity: .35; cursor: default; }
.iconbtn svg { width: 18px; height: 18px; }
.linkbtn { border: 0; background: none; color: var(--accent); font-weight: 700; font-size: 13px; padding: 4px 6px; }

/* mood */
.moods { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.mood { border: 0; background: none; display: grid; justify-items: center; gap: 4px; padding: 4px 0; border-radius: 14px; font-size: 12px; font-weight: 600; color: var(--muted); }
.mood .face { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; font-size: 26px; background: var(--surface-2); border: 2px solid transparent; transition: transform .15s; }
.mood[aria-pressed="true"] { color: var(--ink); }
.mood[aria-pressed="true"] .face { border-color: var(--mc); background: color-mix(in srgb, var(--mc) 22%, var(--surface)); transform: scale(1.08); }
textarea.note { width: 100%; margin-top: 12px; border: 1px solid var(--line); background: var(--surface-2); border-radius: 12px; padding: 10px 12px; resize: vertical; min-height: 64px; }

/* habits */
.habits { display: grid; gap: 8px; }
.habit { display: flex; align-items: center; gap: 12px; width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 14px; padding: 10px 12px; text-align: left; }
.habit .ic { font-size: 22px; width: 28px; text-align: center; }
.habit .nm { flex: 1; font-weight: 600; min-width: 0; }
.habit .chk { width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; color: transparent; flex: none; }
.habit[aria-pressed="true"] { background: color-mix(in srgb, var(--good) 10%, var(--surface)); border-color: color-mix(in srgb, var(--good) 40%, var(--line)); }
.habit[aria-pressed="true"] .chk { background: var(--good); border-color: var(--good); color: #fff; }
.habit[aria-pressed="true"] .nm { text-decoration: line-through; text-decoration-color: color-mix(in srgb, var(--good) 60%, transparent); }
.progress { height: 8px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.progress i { display: block; height: 100%; border-radius: 99px; background: var(--good); }

/* homework */
.hw { display: grid; gap: 10px; }
.hwrow { display: grid; gap: 6px; }
.hwrow .nm { font-weight: 600; font-size: 14px; }
.seg { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; background: var(--surface-2); padding: 3px; border-radius: 12px; }
.seg button { border: 0; background: none; border-radius: 9px; padding: 7px 2px; font-size: 12px; font-weight: 700; color: var(--muted); white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--sc, var(--ink)); box-shadow: 0 1px 3px rgba(0,0,0,.12); }

/* grades */
.gradelist { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
.gpill { display: inline-flex; align-items: center; gap: 8px; border-radius: 12px; padding: 6px 6px 6px 10px; background: var(--surface-2); font-size: 13px; font-weight: 600; }
.gpill .gv { min-width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; font-weight: 800; color: #fff; background: var(--gc); font-variant-numeric: tabular-nums; }
.gpill .x { border: 0; background: none; color: var(--muted); padding: 2px 6px; font-size: 16px; line-height: 1; }
.field { display: grid; gap: 6px; }
.field label { font-size: 12px; font-weight: 700; color: var(--muted); }
select, input[type="text"] { width: 100%; border: 1px solid var(--line); background: var(--surface-2); border-radius: 12px; padding: 10px 12px; }
.gradegrid { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; margin-top: 10px; }
.gradegrid button { border: 1.5px solid var(--line); background: var(--surface); border-radius: 12px; padding: 9px 0; font-weight: 800; font-variant-numeric: tabular-nums; }
.gradegrid button:hover { border-color: var(--gc); }
.gradegrid button:active { background: var(--gc); color: #fff; }
.scale-note { font-size: 12px; color: var(--muted); margin-top: 8px; }
.gradegrid button { display: grid; gap: 2px; align-content: center; padding: 8px 2px; min-width: 0; justify-items: center; background: color-mix(in srgb, var(--gc) 14%, var(--surface)); border-color: color-mix(in srgb, var(--gc) 45%, var(--line)); }
.gradegrid button b { font-size: 17px; color: var(--gc); }
.gradegrid button small { font-size: 9px; font-weight: 700; color: var(--muted); line-height: 1.1; text-align: center; overflow-wrap: anywhere; }
.gradegrid button:active b, .gradegrid button:active small { color: #fff; }
.gscale { display: grid; gap: 4px; margin-top: 10px; font-size: 12px; }
.gscale div { display: flex; align-items: center; gap: 8px; }
.gscale i { flex: none; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-style: normal; font-weight: 800; color: #fff; font-size: 12px; }
.gscale span { color: var(--muted); }
.sw { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: 0; }
.hlegend { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 6px; }
.hlegend button { display: inline-flex; align-items: center; gap: 6px; border: 0; background: none; padding: 3px 0; font-size: 11.5px; font-weight: 600; color: var(--ink); }
.hlegend button i { position: relative; width: 16px; height: 2px; border-radius: 1px; background: var(--c); }
.hlegend button i::after { content: ""; position: absolute; left: 5px; top: -2.5px; width: 6px; height: 6px; border-radius: 50%; background: var(--c); }
.hlegend button[aria-pressed="false"] { color: var(--muted); opacity: .5; }
.hlegend button[aria-pressed="false"] i { --c: var(--empty); }
.slegend { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.slegend button { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 10px 4px 8px; font-size: 12px; font-weight: 700; }
.slegend button i { width: 16px; height: 4px; border-radius: 2px; }
.slegend button[aria-pressed="false"] { opacity: .4; }
.slegend button[aria-pressed="false"] i { background: var(--empty) !important; }
input[type="color"] { width: 40px; height: 38px; flex: none; border: 1px solid var(--line); border-radius: 10px; padding: 3px; background: var(--surface-2); }

/* tabs (segmented) */
.tabs { display: flex; gap: 4px; background: var(--surface); padding: 4px; border-radius: 14px; box-shadow: var(--shadow); }
.tabs button { flex: 1; border: 0; background: none; padding: 9px 4px; border-radius: 10px; font-weight: 700; font-size: 13px; color: var(--muted); }
.tabs button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: thin; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 700; white-space: nowrap; }
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }

/* stat tiles */
.tiles { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.tile { background: var(--surface); border-radius: 16px; padding: 12px 14px; box-shadow: var(--shadow); min-width: 0; }
.tile .v { font-family: var(--f-display); font-weight: 700; font-size: 24px; letter-spacing: -.02em; font-variant-numeric: tabular-nums; display: flex; align-items: baseline; gap: 6px; }
.tile .v small { font-family: var(--f-body); font-size: 13px; font-weight: 700; }
.tile .k { font-size: 12px; font-weight: 700; color: var(--muted); }
.up { color: var(--good); } .down { color: var(--bad); } .flat { color: var(--muted); }

/* charts */
svg.chart { width: 100%; height: auto; display: block; overflow: visible; }
svg.chart text { fill: var(--muted); font-family: var(--f-body); font-size: 10px; font-variant-numeric: tabular-nums; }
.insight { margin: 10px 0 0; font-size: 14px; }
.legend { display: flex; flex-wrap: wrap; gap: 10px; font-size: 12px; color: var(--muted); margin-top: 8px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 4px; vertical-align: -1px; }

/* rows (habit stats, subject stats) */
.rows { display: grid; gap: 12px; }
.srow { display: grid; grid-template-columns: 28px 1fr auto; gap: 4px 10px; align-items: center; }
.srow .ic { font-size: 20px; grid-row: span 2; text-align: center; }
.srow .nm { font-weight: 700; font-size: 14px; min-width: 0; overflow-wrap: anywhere; }
.srow .num { font-weight: 800; font-variant-numeric: tabular-nums; font-size: 14px; text-align: right; }
.srow .bar { grid-column: 2; }
.srow .tr { font-size: 12px; font-weight: 800; text-align: right; white-space: nowrap; }
.dots { display: flex; gap: 3px; flex-wrap: wrap; margin-top: 4px; }
.dots i { width: 9px; height: 9px; border-radius: 3px; background: var(--empty); }
.dots i.on { background: var(--good); }
.dots i.na { background: transparent; border: 1px dashed var(--empty); }
.subj { display: grid; grid-template-columns: 1fr auto auto; gap: 10px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); width: 100%; border-left: 0; border-right: 0; border-bottom: 0; background: none; text-align: left; }
.subj:first-child { border-top: 0; }
.subj .nm { font-weight: 700; font-size: 14px; min-width: 0; }
.subj .nm small { display: block; color: var(--muted); font-weight: 500; font-size: 12px; }
.avgbadge { min-width: 44px; padding: 5px 8px; border-radius: 10px; text-align: center; font-weight: 800; color: #fff; background: var(--gc); font-variant-numeric: tabular-nums; }
.subj[aria-pressed="true"] { background: var(--surface-2); margin-inline: -8px; padding-inline: 8px; width: calc(100% + 16px); border-radius: 12px; }

/* stacked bar */
.stackbar { display: flex; height: 14px; border-radius: 99px; overflow: hidden; background: var(--surface-2); }
.stackbar i { display: block; height: 100%; }

/* calendar */
.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.cal .dh { text-align: center; font-size: 11px; font-weight: 800; color: var(--muted); padding-bottom: 4px; }
.cal button { aspect-ratio: 1; max-width: 100%; border: 0; border-radius: 12px; background: var(--surface-2); display: grid; place-items: center; align-content: center; gap: 1px; font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; position: relative; padding: 0; }
.cal button .e { font-size: 16px; line-height: 1; }
.cal button.has { background: color-mix(in srgb, var(--mc) 28%, var(--surface)); }
.cal button.today { outline: 2px solid var(--accent); outline-offset: -2px; }
.cal button:disabled { opacity: .35; cursor: default; }
.cal button .hb { position: absolute; left: 22%; right: 22%; bottom: 5px; height: 3px; border-radius: 2px; background: var(--empty); overflow: hidden; }
.cal button .hb i { display: block; height: 100%; background: var(--good); }

/* settings */
.list { display: grid; gap: 8px; }
.editrow { display: flex; gap: 8px; align-items: center; }
.editrow input.emo { width: 52px; flex: none; text-align: center; font-size: 18px; padding: 8px 4px; }
.editrow input.nm { flex: 1; min-width: 0; }
.btn { border: 0; border-radius: 12px; padding: 10px 14px; font-weight: 800; background: var(--accent); color: var(--accent-ink); white-space: nowrap; }
.btn.ghost { background: var(--surface-2); color: var(--ink); }
.btn.danger { background: color-mix(in srgb, var(--bad) 14%, var(--surface)); color: var(--bad); }
.btn:disabled { opacity: .5; cursor: default; }
.del { border: 0; background: var(--surface-2); color: var(--muted); border-radius: 10px; width: 38px; height: 38px; flex: none; font-size: 16px; }
.del.armed { background: var(--bad); color: #fff; width: auto; padding: 0 10px; font-size: 13px; font-weight: 800; }
.row-actions { display: flex; flex-wrap: wrap; gap: 8px; }
textarea.json { width: 100%; min-height: 110px; border: 1px solid var(--line); background: var(--surface-2); border-radius: 12px; padding: 10px; font-family: ui-monospace, Menlo, monospace; font-size: 12px; }
.help { font-size: 13px; color: var(--muted); margin: 0; }

.empty { text-align: center; color: var(--muted); padding: 18px 8px; font-size: 14px; }
.empty b { display: block; color: var(--ink); font-family: var(--f-display); font-weight: 500; font-size: 16px; margin-bottom: 4px; }

/* bottom nav */
.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; padding: 8px 12px calc(8px + env(safe-area-inset-bottom, 0px)); background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-top: 1px solid var(--line); }
.nav div { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
.nav button { border: 0; background: none; display: grid; justify-items: center; gap: 2px; padding: 6px 0; border-radius: 12px; font-size: 11px; font-weight: 700; color: var(--muted); }
.nav button svg { width: 22px; height: 22px; }
.nav button[aria-current="page"] { color: var(--accent); background: var(--accent-soft); }

.toast { position: fixed; left: 50%; bottom: calc(86px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-size: 13px; font-weight: 700; z-index: 20; max-width: calc(100% - 32px); text-align: center; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<script>
(() => {
'use strict';

/* ---------- constants ---------- */
const MOODS = {
  5: { label: 'супер', e: '😄', c: 'var(--m5)' },
  4: { label: 'добре', e: '🙂', c: 'var(--m4)' },
  3: { label: 'так собі', e: '😐', c: 'var(--m3)' },
  2: { label: 'погано', e: '🙁', c: 'var(--m2)' },
  1: { label: 'жахливо', e: '😣', c: 'var(--m1)' },
};
const HW = [
  { k: 'done', label: 'Зроблено', c: 'var(--good)' },
  { k: 'part', label: 'Частково', c: 'var(--m3)' },
  { k: 'miss', label: 'Не зроблено', c: 'var(--bad)' },

/* ---------- storage: claude db when available, otherwise this browser ---------- */
const LS_DATA = 'shchodennyk-data-v1';
const Store = {
  mode: 'loading', db: null, unsubDays: null, local: null,
  pending: new Map(), writing: new Set(), timer: null,

  async init() {
    let db = null;
    try { db = window.claude && window.claude.use ? await window.claude.use('db') : null; } catch (e) { db = null; }
    if (db) {
      this.mode = 'db'; this.db = db;
      db.collection('profiles').onSnapshot(snap => {
        const p = {};
        snap.docs.forEach(d => { p[d.id] = d.data(); });
        for (const [path, data] of this.pending) {
          const m = path.match(/^profiles\/([^/]+)$/);
          if (m) { if (data) p[m[1]] = data; else delete p[m[1]]; }
        }
        onProfiles(p, !snap.metadata.fromCache || snap.size > 0);
      }, err => toast('Не вдалося завантажити профілі: ' + err.message));
    } else {
      this.mode = 'local';
      let data = null;
      try { data = JSON.parse(lsGet(LS_DATA)); } catch (e) { data = null; }
      this.local = data && data.profiles ? data : { profiles: JSON.parse(JSON.stringify(DEFAULT_PROFILES)), days: {} };
      migrateLocal(this.local);
      this.persistLocal();
      onProfiles(this.local.profiles, true);
    }
  },
  persistLocal() { lsSet(LS_DATA, JSON.stringify(this.local)); },

  watchDays(pid) {
    if (this.unsubDays) { this.unsubDays(); this.unsubDays = null; }
    if (!pid) return;
    if (this.mode === 'db') {
      this.unsubDays = this.db.collection(`profiles/${pid}/days`).onSnapshot(snap => {
        const days = {};
        snap.docs.forEach(d => { days[d.id] = d.data(); });
        const prefix = `profiles/${pid}/days/`;
        for (const [path, data] of this.pending) {
          if (path.startsWith(prefix)) { const k = path.slice(prefix.length); if (data) days[k] = data; else delete days[k]; }
        }
        onDays(pid, days);
      }, err => toast('Не вдалося завантажити записи: ' + err.message));
    } else {
      onDays(pid, this.local.days[pid] || {});
    }
  },

  write(path, data) {
    if (this.mode === 'local') {
      const parts = path.split('/');
      if (parts.length === 2) { if (data) this.local.profiles[parts[1]] = data; else delete this.local.profiles[parts[1]]; }
      else {
        const pid = parts[1], date = parts[3];
        this.local.days[pid] = this.local.days[pid] || {};
        if (data) this.local.days[pid][date] = data; else delete this.local.days[pid][date];
      }
      this.persistLocal();
      return;
    }
    this.pending.set(path, data);
    clearTimeout(this.timer);
    this.timer = setTimeout(() => this.flush(), 450);
  },
  async flush() {
    for (const [path, data] of [...this.pending]) {
      if (this.writing.has(path)) continue;
      this.pending.delete(path);
      this.writing.add(path);
      try {
        const ref = this.db.doc(path);
        if (data) await ref.set(data); else await ref.delete();
      } catch (e) {
        if (e && e.code === 'unavailable') {
          if (!this.pending.has(path)) this.pending.set(path, data);
        } else if (e && e.code === 'invalid_argument') {
          S.readOnly = true; render();
          toast('Немає дозволу зберігати. Попроси власника дати тобі доступ «Contributor».');
        } else if (e && e.code === 'quota_exceeded') {
          toast('Сховище заповнене: ' + e.message);
        } else {
          toast('Не вдалося зберегти: ' + (e && e.message || 'помилка'));
        }
      } finally {
        this.writing.delete(path);
      }
    }
    if (this.pending.size) { clearTimeout(this.timer); this.timer = setTimeout(() => this.flush(), 800 + Math.random() * 600); }
  },
  async allDays(pid) {
    if (this.mode === 'local') return this.local.days[pid] || {};
    const snap = await this.db.collection(`profiles/${pid}/days`).get();
    const out = {}; snap.docs.forEach(d => { out[d.id] = d.data(); }); return out;
  },
};

/* ---------- periods ---------- */
function range(period, anchor) {
  const a = parse(anchor), y = a.getFullYear(), m = a.getMonth();
  let start, end, label;
  if (period === 'week') {
    start = addDays(anchor, -dow(anchor)); end = addDays(start, 6);
    const s = parse(start), e = parse(end);
    label = s.getMonth() === e.getMonth()
      ? `${s.getDate()}–${e.getDate()} ${MONTH_GEN[e.getMonth()]}`
      : `${s.getDate()} ${MONTH_GEN[s.getMonth()]} – ${e.getDate()} ${MONTH_GEN[e.getMonth()]}`;
  } else if (period === 'month') {
    start = iso(new Date(y, m, 1)); end = iso(new Date(y, m + 1, 0));
    label = `${cap(MONTH_NOM[m])} ${y}`;
  } else if (period === 'year') {
    const sy = m >= 8 ? y : y - 1;
    start = iso(new Date(sy, 8, 1)); end = iso(new Date(sy + 1, 7, 31));
    label = `Навчальний рік ${sy}/${String(sy + 1).slice(2)}`;
  } else {
    start = iso(new Date(y, m - 2, 1)); end = iso(new Date(y, m + 1, 0));
    const s = parse(start);
    label = `${cap(MONTH_NOM[s.getMonth()])} – ${MONTH_NOM[m]} ${y}`;
  }
  return { start, end, label };
}
function shiftAnchor(period, anchor, dir) {
  if (period === 'week') return addDays(anchor, 7 * dir);
  const a = parse(anchor), step = period === 'month' ? 1 : period === 'year' ? 12 : 3;
  return iso(new Date(a.getFullYear(), a.getMonth() + step * dir, 1));
}
function dates(start, end) { const out = []; for (let d = start; d <= end; d = addDays(d, 1)) out.push(d); return out; }
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);

/* ---------- aggregation ---------- */
function summarize(start, end) {
  const p = prof(), all = daysOf(), t = today();
  const ds = dates(start, end);
  const logged = ds.filter(d => all[d]);
  const moods = logged.map(d => all[d].mood).filter(Boolean);
  const habit = {};
  (p.habits || []).forEach(h => { habit[h.id] = { done: 0 }; });
  let habitDone = 0, habitTotal = 0;
  logged.forEach(d => (p.habits || []).forEach(h => {
    habitTotal++; if (all[d].habits && all[d].habits[h.id]) { habitDone++; habit[h.id].done++; }
  }));
  const hw = { done: 0, part: 0, miss: 0 }, hwSubj = {};
  const grades = {};
  (p.subjects || []).forEach(s => { hwSubj[s.id] = { done: 0, part: 0, miss: 0 }; grades[s.id] = []; });
  logged.forEach(d => {
    const day = all[d];
    Object.entries(day.hw || {}).forEach(([sid, st]) => {
      if (st in hw) { hw[st]++; if (hwSubj[sid]) hwSubj[sid][st]++; }
    });
    (day.grades || []).forEach(g => { if (grades[g.s]) grades[g.s].push({ d, v: g.v }); });
  });
  const hwTotal = hw.done + hw.part + hw.miss;
  const allGrades = Object.values(grades).flat();
  return {
    ds, logged, past: ds.filter(d => d <= t).length,
    moodAvg: moods.length ? moods.reduce((a, b) => a + b, 0) / moods.length : null,
    moodCount: moods.length,
    habit, habitPct: habitTotal ? habitDone / habitTotal : null,
    hw, hwSubj, hwTotal, hwPct: hwTotal ? (hw.done + hw.part * 0.5) / hwTotal : null,
    grades, gradeAvg: allGrades.length ? allGrades.reduce((a, g) => a + g.v, 0) / allGrades.length : null,
    gradeCount: allGrades.length,
  };
}
const avg = arr => arr.length ? arr.reduce((a, b) => a + b, 0) / arr.length : null;
function trend(cur, prev, unit, digits) {
  if (cur == null || prev == null) return '<span class="flat">—</span>';
  const diff = cur - prev;
  const shown = unit === '%' ? Math.round(diff * 100) : Math.round(diff * 10) / 10;
  if (Math.abs(shown) < (unit === '%' ? 1 : 0.1)) return '<span class="flat">≈ так само</span>';
  const cls = diff > 0 ? 'up' : 'down', arrow = diff > 0 ? '↑' : '↓';
  const val = unit === '%' ? `${Math.abs(shown)}%` : fmt1(Math.abs(shown));
  return `<span class="${cls}">${arrow} ${val}</span>`;
}
function streak(date) {
  const all = daysOf(); let n = 0, d = all[date] ? date : addDays(date, -1);
  while (all[d]) { n++; d = addDays(d, -1); }
  return n;
}

/* ---------- charts ---------- */
const W = 340;
function moodChart(ds) {
  const all = daysOf(), H = 130, top = 8, bottom = 22, left = 4, right = 4;
  const n = ds.length, slot = (W - left - right) / n, bw = Math.max(0.8, Math.min(28, slot * 0.68));
  const ih = H - top - bottom;
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Настрій по днях">`;
  [1, 3, 5].forEach(v => { const y = top + ih - (v / 5) * ih; s += `<line x1="${left}" x2="${W - right}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-dasharray="${v === 3 ? '3 3' : '0'}" stroke-width="1"/>`; });
  ds.forEach((d, i) => {
    const x = left + i * slot + (slot - bw) / 2, m = all[d] && all[d].mood;
    if (m) {
      const h = (m / 5) * ih;
      s += `<rect x="${x.toFixed(1)}" y="${(top + ih - h).toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="${Math.min(6, bw / 2).toFixed(1)}" fill="${MOODS[m].c}"><title>${d}: ${MOODS[m].label}</title></rect>`;
    } else {
      s += `<rect x="${x.toFixed(1)}" y="${(top + ih - 3).toFixed(1)}" width="${bw.toFixed(1)}" height="3" rx="1.5" fill="var(--empty)"/>`;
    }
    const lab = xLabel(ds, i);
    if (lab) s += `<text x="${(left + i * slot + slot / 2).toFixed(1)}" y="${H - 6}" text-anchor="middle">${lab}</text>`;
  });
  return s + '</svg>';
}
function xLabel(ds, i) {
  const n = ds.length, d = parse(ds[i]);
  if (n <= 7) return DOW_SHORT[dow(ds[i])];
  if (n <= 31) return (d.getDate() === 1 || d.getDate() % 5 === 0) && d.getDate() !== 30 ? d.getDate() : '';
  return d.getDate() === 1 ? MONTH_NOM[d.getMonth()].slice(0, 3) : '';
}
function weekdayChart(byDow) {
  const H = 120, top = 16, bottom = 20, ih = H - top - bottom, slot = W / 7, bw = 26;
  const vals = byDow.map(avg);
  const have = vals.filter(v => v != null);
  const best = have.length > 1 ? Math.max(...have) : null, worst = have.length > 1 ? Math.min(...have) : null;
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Середній настрій за днями тижня">`;
  vals.forEach((v, i) => {
    const x = i * slot + (slot - bw) / 2;
    if (v != null) {
      const h = (v / 5) * ih;
      s += `<rect x="${x.toFixed(1)}" y="${(top + ih - h).toFixed(1)}" width="${bw}" height="${h.toFixed(1)}" rx="7" fill="${moodColor(v)}" opacity="${v === best || v === worst ? 1 : .55}"/>`;
      s += `<text x="${(x + bw / 2).toFixed(1)}" y="${(top + ih - h - 4).toFixed(1)}" text-anchor="middle" style="font-weight:800;fill:var(--ink)">${fmt1(v)}</text>`;
    } else {
      s += `<rect x="${x.toFixed(1)}" y="${top + ih - 3}" width="${bw}" height="3" rx="1.5" fill="var(--empty)"/>`;
    }
    s += `<text x="${(x + bw / 2).toFixed(1)}" y="${H - 5}" text-anchor="middle" style="${v === best && best !== worst ? 'font-weight:800;fill:var(--good)' : v === worst && best !== worst ? 'font-weight:800;fill:var(--bad)' : ''}">${DOW_SHORT[i]}</text>`;
  });
  return { svg: s + '</svg>', vals, best, worst };
}
function smoothPath(pts, yMin, yMax) {
  // Catmull-Rom spline (like the reference charts), control points kept inside the plot
  if (pts.length < 2) return '';
  const f = v => v.toFixed(1), cl = y => Math.max(yMin, Math.min(yMax, y));
  let d = `M${f(pts[0][0])},${f(pts[0][1])}`;
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2;
    // control points never pass the next/previous point horizontally, so the line cannot loop
    const span = p2[0] - p1[0];
    const c1 = [p1[0] + Math.min(span / 2, Math.max(0, (p2[0] - p0[0]) / 6)), cl(p1[1] + (p2[1] - p0[1]) / 6)];
    const c2 = [p2[0] - Math.min(span / 2, Math.max(0, (p3[0] - p1[0]) / 6)), cl(p2[1] - (p3[1] - p1[1]) / 6)];
    d += ` C${f(c1[0])},${f(c1[1])} ${f(c2[0])},${f(c2[1])} ${f(p2[0])},${f(p2[1])}`;
  }

}
function gradeChart(grades, subs, ds, focus, hidden) {
  const H = 300, top = 30, bottom = 30, left = 26, right = 16, ih = H - top - bottom, iw = W - left - right;
  const first = ds[0], last = ds[ds.length - 1];
  const visible = subs.map((sub, i) => ({ sub, i })).filter(({ sub }) => !hidden.has(sub.id));
  const all = [];
  visible.forEach(({ sub, i }) => (grades[sub.id] || []).forEach(g => {
    if (g.d >= first && g.d <= last) all.push({ ...g, sid: sub.id, color: subjColor(sub, i) });
  }));
  const cats = [...new Set(all.map(g => g.d))].sort();
  const ci = {}; cats.forEach((d, k) => { ci[d] = k; });
  const X = d => left + (ci[d] + 0.5) * (iw / Math.max(1, cats.length));
  const Y = v => top + ih - ((v - 1) / 5) * ih;
  const font = 'font-family:var(--f-body);';
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Оцінки з усіх предметів по датах">`;
  for (let v = 1; v <= 6; v++) {
    s += `<line x1="${left}" x2="${W - right}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}" stroke="var(--line)" stroke-width="0.6"/>`;
    s += `<text x="${left - 8}" y="${(Y(v) + 3).toFixed(1)}" text-anchor="end" style="${font}font-size:9px;fill:var(--muted)">${v}</text>`;
  }
  // thin axes: grades go up, dates go right
  s += `<line x1="${left}" y1="${top + ih}" x2="${left}" y2="${top - 14}" stroke="var(--muted)" stroke-width="0.7"/>`;
  s += `<path d="M${left - 2.5},${top - 10} L${left},${top - 15} L${left + 2.5},${top - 10}" fill="none" stroke="var(--muted)" stroke-width="0.7"/>`;
  s += `<text x="${left + 6}" y="${top - 10}" style="${font}font-size:8.5px;fill:var(--muted)">оцінка</text>`;
  s += `<line x1="${left}" y1="${top + ih}" x2="${W - right + 6}" y2="${top + ih}" stroke="var(--muted)" stroke-width="0.7"/>`;
  s += `<path d="M${W - right + 1},${top + ih - 2.5} L${W - right + 6},${top + ih} L${W - right + 1},${top + ih + 2.5}" fill="none" stroke="var(--muted)" stroke-width="0.7"/>`;
  let lastX = -99;
  cats.forEach(d => {
    const x = X(d);
    if (x - lastX >= 24) { s += `<text x="${x.toFixed(1)}" y="${top + ih + 15}" text-anchor="middle" style="${font}font-size:8.5px;fill:var(--muted);letter-spacing:.02em">${fmtDM(d)}</text>`; lastX = x; }
  });
  if (!cats.length) s += `<text x="${left + iw / 2}" y="${top + ih / 2}" text-anchor="middle" style="${font}font-size:10px;fill:var(--muted)">Немає оцінок за цей період</text>`;
  const groups = {};
  all.forEach(g => { (groups[g.d + '|' + g.v] = groups[g.d + '|' + g.v] || []).push(g); });

    if (pts.length > 1) s += `<path d="${smoothPath(pts, top, top + ih)}" fill="none" stroke="${subjColor(sub, i)}" stroke-width="${focus === sub.id ? 2.2 : 1.5}" stroke-linecap="round" stroke-linejoin="round" opacity="${dim(sub.id) ? 0.1 : 0.9}"/>`;
  });

          if (!n) return '';
          return `<div class="srow" style="grid-template-columns:1fr auto"><span class="nm">${esc(s.name)} <span class="meta">${h.done}/${n}${h.miss ? ` · пропущено ${h.miss}` : ''}</span></span><span class="num">${Math.round(pct * 100)}%</span>
            <div class="bar" style="grid-column:1"><div class="progress"><i style="width:${pct * 100}%;background:${pct >= .8 ? 'var(--good)' : pct >= .5 ? 'var(--m3)' : 'var(--bad)'}"></i></div></div><span class="tr">${trend(pct, ppct, '%')}</span></div>`;
        }).join('') + '</div>';
    } else html += `<p class="help">За цей період домашку ще не позначали.</p>`;
    html += '</section>';

    // grades by subject
    const focus = S.gradeSubject && subs.find(x => x.id === S.gradeSubject) ? S.gradeSubject : null;
    const hidden = S.hiddenSubjects || (S.hiddenSubjects = new Set());
    html += `<section class="card"><div class="card-head"><h2>Оцінки з предметів</h2><span class="meta">середня і зміна</span></div>`;
    if (cur.gradeCount || prev.gradeCount) {
      const ranked = subs.map((sub, i) => {
        const a = avg(cur.grades[sub.id].map(g => g.v)), b = avg(prev.grades[sub.id].map(g => g.v));
        return { s: sub, i, a, b, n: cur.grades[sub.id].length };
      });
      html += `${gradeChart(cur.grades, subs, cur.ds, focus, hidden)}
        <div class="hlegend">${subs.map((sub, i) => `<button data-act="subj-toggle" data-id="${esc(sub.id)}" aria-pressed="${!hidden.has(sub.id)}"><i style="--c:${subjColor(sub, i)}"></i>${esc(sub.name)}</button>`).join('')}</div>
        <p class="meta" style="margin:6px 0 14px">Колір кружечка й цифри показує оцінку, колір лінії показує предмет. Назви предметів під графіком ховають і показують лінії, а натискання на предмет у списку виділяє його лінію.</p>`;
      html += '<div>' + ranked.map(({ s: sub, i, a, b, n }) => `<button class="subj" data-act="grade-pick" data-id="${esc(sub.id)}" aria-pressed="${sub.id === focus}">
          <span class="nm"><i class="sw" style="background:${subjColor(sub, i)}"></i>${esc(sub.name)}<small>${n ? `${n} ${plural(n, 'оцінка', 'оцінки', 'оцінок')} · ${gradeBand(a)}` : 'немає оцінок за період'}</small></span>
          <span class="tr" style="font-size:13px;font-weight:800">${trend(a, b)}</span>
          <span class="avgbadge" style="--gc:${a != null ? gradeColor(a) : 'var(--empty)'}">${a != null ? fmt1(a) : '—'}</span></button>`).join('') + '</div>';
      html += insightGrades(ranked);
    } else html += `<p class="help">Оцінок за цей період ще немає. Додай їх на вкладці «День» або вибери період «Рік».</p>`;
    html += '</section>';
  }
  html += '</div>';
  return html;
}
function insightGrades(ranked) {
  const ch = ranked.filter(x => x.a != null && x.b != null).map(x => ({ ...x, d: x.a - x.b }));
  if (!ch.length) return '';
  const up = ch.filter(x => x.d >= 0.3).sort((a, b) => b.d - a.d), down = ch.filter(x => x.d <= -0.3).sort((a, b) => a.d - b.d);
  const parts = [];
  if (up.length) parts.push(`Пішло вгору: <b class="up">${up.map(x => esc(x.s.name)).join(', ')}</b>.`);
  if (down.length) parts.push(`Варто підтягнути: <b class="down">${down.map(x => esc(x.s.name)).join(', ')}</b>.`);
  if (!parts.length) parts.push('Оцінки тримаються на тому самому рівні, що й минулого періоду.');
  return `<p class="insight">${parts.join(' ')}</p>`;
}
function plural(n, one, few, many) {
  const a = Math.abs(n) % 100, b = a % 10;
  if (a > 10 && a < 20) return many;
  if (b > 1 && b < 5) return few;
  if (b === 1) return one;
  return many;
}

function viewCal() {
  const [y, m] = S.calMonth.split('-').map(Number);
  const first = iso(new Date(y, m - 1, 1)), last = iso(new Date(y, m, 0)), t = today();
  const all = daysOf(), habits = prof().habits || [];
  const ds = dates(first, last);
  let html = `<div class="stack"><div class="datenav" style="margin:0">
    <button class="iconbtn" data-act="cal-shift" data-n="-1" aria-label="Попередній місяць">${ICON_L}</button>
    <div class="label"><b>${cap(MONTH_NOM[m - 1])} ${y}</b><span>${ds.filter(d => all[d]).length} ${plural(ds.filter(d => all[d]).length, 'день', 'дні', 'днів')} із записами</span></div>
    <button class="iconbtn" data-act="cal-shift" data-n="1" aria-label="Наступний місяць" ${last >= t ? 'disabled' : ''}>${ICON_R}</button>
  </div><section class="card"><div class="cal">${DOW_SHORT.map(d => `<div class="dh">${d}</div>`).join('')}`;
  for (let i = 0; i < dow(first); i++) html += '<div></div>';
  ds.forEach(d => {
    const day = all[d], mood = day && day.mood;
    const hp = day && habits.length ? habits.filter(h => day.habits && day.habits[h.id]).length / habits.length : null;
    html += `<button data-act="open-day" data-d="${d}" class="${mood ? 'has' : ''} ${d === t ? 'today' : ''}" style="${mood ? `--mc:${MOODS[mood].c}` : ''}" ${d > t ? 'disabled' : ''} aria-label="${d}${mood ? ', ' + MOODS[mood].label : ''}">
      ${mood ? `<span class="e">${MOODS[mood].e}</span>` : ''}<span>${parse(d).getDate()}</span>${hp != null ? `<span class="hb"><i style="width:${hp * 100}%"></i></span>` : ''}</button>`;
  });
  html += `</div><div class="legend"><span><i style="background:var(--good)"></i>смужка внизу: частка виконаних звичок</span></div></section>`;

  const counts = [5, 4, 3, 2, 1].map(v => ds.filter(d => all[d] && all[d].mood === v).length), total = counts.reduce((a, b) => a + b, 0);
  html += `<section class="card"><div class="card-head"><h2>Настрої місяця</h2><span class="meta">${total} ${plural(total, 'запис', 'записи', 'записів')}</span></div>`;
  if (total) html += `<div class="stackbar">${[5, 4, 3, 2, 1].map((v, i) => `<i style="width:${counts[i] / total * 100}%;background:${MOODS[v].c}"></i>`).join('')}</div>
    <div class="legend">${[5, 4, 3, 2, 1].map((v, i) => `<span><i style="background:${MOODS[v].c}"></i>${MOODS[v].e} ${MOODS[v].label} · ${counts[i]}</span>`).join('')}</div>`;
  else html += `<p class="help">У цьому місяці ще немає записів настрою.</p>`;
  html += '</section></div>';
  return html;
}

function viewMore() {
  const p = prof(), arm = k => S.armed === k;
  let html = `<div class="stack">
  <section class="card"><div class="card-head"><h2>Профіль</h2></div>
    <div class="editrow"><input type="text" class="emo" id="p-emoji" data-act="p-emoji" value="${esc(p.emoji || '')}" maxlength="4" aria-label="Значок профілю"><input type="text" class="nm" id="p-name" data-act="p-name" value="${esc(p.name)}" aria-label="Імʼя профілю"></div>
    <div class="row-actions" style="margin-top:10px">
      <button class="btn ghost" data-act="add-profile">+ Новий профіль</button>
      ${sortedPids().length > 1 ? `<button class="btn danger" data-act="del-profile">${arm('profile') ? 'Видалити профіль назавжди?' : 'Видалити профіль'}</button>` : ''}
    </div>
  </section>

  <section class="card"><div class="card-head"><h2>Звички</h2><span class="meta">${(p.habits || []).length}</span></div><div class="list">` +
    (p.habits || []).map(h => `<div class="editrow"><input type="text" class="emo" id="h-ic-${esc(h.id)}" data-act="h-icon" data-id="${esc(h.id)}" value="${esc(h.icon || '')}" maxlength="4" aria-label="Значок звички"><input type="text" class="nm" id="h-nm-${esc(h.id)}" data-act="h-name" data-id="${esc(h.id)}" value="${esc(h.name)}" aria-label="Назва звички"><button class="del ${arm('h' + h.id) ? 'armed' : ''}" data-act="h-del" data-id="${esc(h.id)}" aria-label="Видалити звичку">${arm('h' + h.id) ? 'Видалити?' : '✕'}</button></div>`).join('') +
    `<form class="editrow" data-form="add-habit"><input type="text" class="emo" id="new-h-ic" placeholder="⭐" maxlength="4" aria-label="Значок нової звички"><input type="text" class="nm" id="new-h-nm" placeholder="Нова звичка, напр. «Пити воду»" aria-label="Назва нової звички"><button class="btn" type="submit">Додати</button></form>
  </div></section>

  <section class="card"><div class="card-head"><h2>Шкільні предмети</h2><span class="meta">${(p.subjects || []).length}</span></div>
    <p class="help" style="margin-bottom:10px">Якщо предметів немає, розділи «Домашні завдання» та «Оцінки» не показуються.</p><div class="list">` +
    (p.subjects || []).map((s, i) => `<div class="editrow"><input type="color" id="s-c-${esc(s.id)}" data-act="s-color" data-id="${esc(s.id)}" value="${esc(subjColor(s, i))}" aria-label="Колір предмета"><input type="text" class="nm" id="s-nm-${esc(s.id)}" data-act="s-name" data-id="${esc(s.id)}" value="${esc(s.name)}" aria-label="Назва предмета"><button class="del ${arm('s' + s.id) ? 'armed' : ''}" data-act="s-del" data-id="${esc(s.id)}" aria-label="Видалити предмет">${arm('s' + s.id) ? 'Видалити?' : '✕'}</button></div>`).join('') +
    `<form class="editrow" data-form="add-subject"><input type="text" class="nm" id="new-s-nm" placeholder="Новий предмет, напр. «Фізкультура»" aria-label="Назва нового предмета"><button class="btn" type="submit">Додати</button></form>
  </div></section>

  <section class="card"><div class="card-head"><h2>Резервна копія</h2></div>
    <p class="help">Збережи всі записи у файл або скопіюй їх, щоб перенести на інший пристрій.</p>
    <div class="row-actions" style="margin-top:10px">
      <button class="btn ghost" data-act="export">Зберегти файл</button>
      <button class="btn ghost" data-act="copy">Скопіювати</button>
      <button class="btn ghost" data-act="toggle-import">Відновити з копії</button>
    </div>
    ${S.showJson ? `<div style="margin-top:10px" class="list"><textarea class="json" id="import-json" placeholder="Встав сюди скопійовані дані"></textarea><button class="btn" data-act="import">${arm('import') ? 'Замінити все цими даними?' : 'Відновити'}</button></div>` : ''}
    <p class="help" style="margin-top:10px">${Store.mode === 'db' ? 'Записи зберігаються в хмарі Claude і доступні всім, з ким поділишся щоденником.' : 'Записи зберігаються тільки в цьому браузері. Роби копію час від часу.'}</p>
  </section>
  </div>`;
  return html;
}

/* ---------- actions ---------- */
function setView(v) { S.view = v; S.armed = null; savePrefs(); render(); window.scrollTo(0, 0); }

document.addEventListener('click', e => {
  const nav = e.target.closest('.nav button');
  if (nav) { setView(nav.dataset.view); return; }
  const el = e.target.closest('[data-act]');
  if (!el || el.tagName === 'SELECT' || el.tagName === 'INPUT' || el.tagName === 'TEXTAREA') return;
  const act = el.dataset.act, id = el.dataset.id;
  const ae = document.activeElement;
  if (ae && ae.matches && ae.matches('input, textarea') && ae.closest('#main')) ae.blur();
  const armedBefore = S.armed;
  if (!['h-del', 's-del', 'del-profile', 'import', 'clear-examples'].includes(act)) S.armed = null;
  const day = () => getDay(S.date);

  switch (act) {
    case 'pick-profile':
      if (id !== S.pid) { S.pid = id; S.subject = null; S.gradeSubject = null; savePrefs(); Store.watchDays(id); }
      break;
    case 'day-shift': { const n = +el.dataset.n, d = addDays(S.date, n); if (d <= today()) S.date = d; break; }
    case 'day-today': S.date = today(); break;
    case 'mood': { const d = day(), v = +el.dataset.v; d.mood = d.mood === v ? null : v; saveDay(S.date, d); break; }
    case 'habit': { const d = day(); d.habits[id] = !d.habits[id]; if (!d.habits[id]) delete d.habits[id]; saveDay(S.date, d); break; }
    case 'hw': { const d = day(), k = el.dataset.k; if (d.hw[id] === k) delete d.hw[id]; else d.hw[id] = k; saveDay(S.date, d); break; }
    case 'grade-add': {
      const d = day(), sel = $('#gsub') ? $('#gsub').value : null; if (!sel) break;
      S.subject = sel; d.grades.push({ s: sel, v: +el.dataset.v }); saveDay(S.date, d);
      const s = (prof().subjects || []).find(x => x.id === sel);
      toast(`Додано ${el.dataset.v} · ${s ? s.name : ''}`);
      break;
    }
    case 'grade-del': { const d = day(); d.grades.splice(+el.dataset.i, 1); saveDay(S.date, d); break; }
    case 'period': S.period = el.dataset.k; S.anchor = today(); savePrefs(); break;
    case 'period-shift': { const a = shiftAnchor(S.period, S.anchor, +el.dataset.n); if (range(S.period, a).start <= today()) S.anchor = a; break; }
    case 'grade-pick': S.gradeSubject = S.gradeSubject === id ? null : id; break;
    case 'subj-toggle': { const h = S.hiddenSubjects || (S.hiddenSubjects = new Set()); if (h.has(id)) h.delete(id); else h.add(id); break; }
    case 'cal-shift': { const [y, m] = S.calMonth.split('-').map(Number); S.calMonth = iso(new Date(y, m - 1 + +el.dataset.n, 1)).slice(0, 7); break; }
    case 'open-day': S.date = el.dataset.d; setView('day'); return;
    case 'create-defaults':
      Object.entries(DEFAULT_PROFILES).forEach(([k, v]) => saveProfile(k, JSON.parse(JSON.stringify(v))));
      S.pid = 'donia'; Store.watchDays('donia'); break;
    case 'add-profile': {
      const k = uid('p'), n = sortedPids().length;
      saveProfile(k, { name: 'Новий профіль', emoji: '🙂', order: n, habits: [], subjects: [] });
      S.pid = k; savePrefs(); Store.watchDays(k); toast('Профіль створено. Дай йому імʼя нижче.');
      break;
    }
    case 'del-profile':
      if (armedBefore !== 'profile') { S.armed = 'profile'; break; }
      S.armed = null; saveProfile(S.pid, null); S.pid = sortedPids()[0] || null; savePrefs(); Store.watchDays(S.pid);
      toast('Профіль видалено'); break;
    case 'h-del': case 's-del': {
      const key = (act === 'h-del' ? 'h' : 's') + id;
      if (armedBefore !== key) { S.armed = key; break; }
      S.armed = null;
      const p = JSON.parse(JSON.stringify(prof())), f = act === 'h-del' ? 'habits' : 'subjects';
      p[f] = p[f].filter(x => x.id !== id); saveProfile(S.pid, p); break;
    }
    case 'clear-examples': {
      if (armedBefore !== 'examples') { S.armed = 'examples'; break; }
      S.armed = null;
      const days = Object.assign({}, daysOf());
      Object.entries(days).forEach(([d, v]) => {
        const grades = v.grades || [], real = grades.filter(g => !g.ex);
        if (!v.example && real.length === grades.length) return;
        const nd = v.example ? Object.assign(emptyDay(), { grades: real }) : Object.assign({}, v, { grades: real });
        if (isEmptyDay(nd)) { delete days[d]; Store.write(`profiles/${S.pid}/days/${d}`, null); }
        else { days[d] = nd; Store.write(`profiles/${S.pid}/days/${d}`, nd); }
      });
      S.days[S.pid] = days; toast('Приклад прибрано'); break;
    }
    case 'export': exportData(); return;
    case 'copy': copyData(); return;
    case 'toggle-import': S.showJson = !S.showJson; break;
    case 'import':
      if (armedBefore !== 'import') { S.armed = 'import'; break; }
      S.armed = null; importData(); return;
    default: return;
  }
  render();
});

document.addEventListener('submit', e => {
  const f = e.target.closest('[data-form]'); if (!f) return;
  e.preventDefault();
  const p = JSON.parse(JSON.stringify(prof()));
  if (f.dataset.form === 'add-habit') {
    const nm = $('#new-h-nm').value.trim(); if (!nm) { toast('Напиши назву звички'); return; }
    p.habits = p.habits || []; p.habits.push({ id: uid('h'), name: nm, icon: $('#new-h-ic').value.trim() || '⭐' });
    $('#new-h-nm').value = ''; $('#new-h-ic').value = '';
  } else {
    const nm = $('#new-s-nm').value.trim(); if (!nm) { toast('Напиши назву предмета'); return; }
    p.subjects = p.subjects || [];
    const used = new Set(p.subjects.map((x, i) => subjColor(x, i)));
    p.subjects.push({ id: uid('s'), name: nm, color: SUBJECT_COLORS.find(c => !used.has(c)) || SUBJECT_COLORS[p.subjects.length % SUBJECT_COLORS.length] });
    $('#new-s-nm').value = '';
  }
  saveProfile(S.pid, p);
  document.activeElement && document.activeElement.blur();
  render();
});

let noteTimer;
document.addEventListener('input', e => {
  if (e.target.id === 'note') {
    const v = e.target.value, date = S.date, pid = S.pid;
    clearTimeout(noteTimer);
    noteTimer = setTimeout(() => { if (pid !== S.pid) return; const d = getDay(date); d.note = v; saveDay(date, d); }, 600);
  }
});
document.addEventListener('change', e => {
  const el = e.target, act = el.dataset && el.dataset.act;
  if (!act) return;
  if (act === 'grade-subject') { S.subject = el.value; return; }
  const p = JSON.parse(JSON.stringify(prof())), v = el.value.trim();
  if (act === 'p-name') { if (!v) return; p.name = v; }
  else if (act === 'p-emoji') p.emoji = v || '🙂';
  else if (act === 'h-name' || act === 'h-icon') {
    const h = p.habits.find(x => x.id === el.dataset.id); if (!h) return;
    if (act === 'h-name') { if (!v) return; h.name = v; } else h.icon = v || '⭐';
  } else if (act === 's-name') {
    const s = p.subjects.find(x => x.id === el.dataset.id); if (!s || !v) return; s.name = v;
  } else if (act === 's-color') {
    const i = p.subjects.findIndex(x => x.id === el.dataset.id); if (i < 0) return; p.subjects[i].color = v; saveProfile(S.pid, p); render(); return;
  } else return;
  saveProfile(S.pid, p);
});
document.addEventListener('focusout', () => {
  setTimeout(() => {
    const a = document.activeElement;
    if (S.deferred && !(a && a.closest && a.closest('#main') && a.matches('input[type="text"], textarea'))) render();
  }, 0);
});

/* ---------- backup ---------- */
async function collect() {
  const out = { app: 'shchodennyk', version: 1, exported: new Date().toISOString(), profiles: S.profiles, days: {} };
  for (const pid of Object.keys(S.profiles)) out.days[pid] = await Store.allDays(pid);
  return JSON.stringify(out, null, 1);
}
async function exportData() {
  const json = await collect();
  let dl = null;
  try { dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null; } catch (e) { dl = null; }
  if (dl) {
    try { await dl.save({ filename: `shchodennyk-${today()}.json`, data: json }); toast('Файл збережено'); }
    catch (e) { if (e.code !== 'declined') toast('Не вдалося зберегти файл. Спробуй «Скопіювати».'); }
    return;
  }
  try {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([json], { type: 'application/json' }));
    a.download = `shchodennyk-${today()}.json`; a.click();
  } catch (e) { toast('Не вдалося зберегти файл. Спробуй «Скопіювати».'); }
}
async function copyData() {
  const p = collect();
  try {
    await navigator.clipboard.writeText(await p);
    toast('Скопійовано. Встав у нотатки чи повідомлення собі.');
  } catch (e) {
    S.showJson = true; render();
    const ta = $('#import-json'); ta.value = await p; ta.select(); toast('Виділено. Скопіюй вручну.');
  }
}
function importData() {
  let data;
  try { data = JSON.parse($('#import-json').value); } catch (e) { toast('Не схоже на копію щоденника. Перевір текст.'); render(); return; }
  if (!data || !data.profiles || !data.days) { toast('У копії немає профілів чи записів.'); render(); return; }
  Object.entries(data.profiles).forEach(([pid, p]) => saveProfile(pid, p));
  Object.entries(data.days).forEach(([pid, days]) => Object.entries(days).forEach(([d, v]) => Store.write(`profiles/${pid}/days/${d}`, v)));
  if (Store.mode === 'local') { S.days = {}; }
  S.showJson = false; S.pid = Object.keys(data.profiles)[0]; Store.watchDays(S.pid);
  toast('Дані відновлено'); render();
}

/* ---------- boot ---------- */
render();
Store.init();
})();
</script>
