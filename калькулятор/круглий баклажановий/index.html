<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Круглий баклажановий калькулятор</title>
<style>
  :root{
    /* Баклажановий — колір основи */
    --aubergine-1:#3a1440;
    --aubergine-2:#26082c;
    --aubergine-3:#140316;
    --grout:#1c0620;            /* «шов» між кнопками */
    --cream:#f7e9f2;            /* колір цифр */
    --gold:#ffe6c2;             /* колір знаків */

    --w:88px;                   /* ширина трикутника */
    --h:77px;                   /* висота трикутника */
  }

  *{box-sizing:border-box;margin:0;padding:0}

  html,body{height:100%}
  body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
      radial-gradient(120% 120% at 30% 10%, #2a0e30 0%, #12040f 55%, #060207 100%);
    font-family:"Arial Narrow","Helvetica Neue",Arial,sans-serif;
    padding:24px;
    -webkit-font-smoothing:antialiased;
  }

  /* ── Кругле тіло калькулятора ── */
  .calc{
    position:relative;
    width:500px;
    height:500px;
    max-width:92vw;
    max-height:92vw;
    border-radius:50%;
    padding:34px 22px 30px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    /* Баклажанова оксамитова основа */
    background:
      radial-gradient(70% 60% at 50% 20%, rgba(150,60,150,.28), rgba(150,60,150,0) 60%),
      radial-gradient(120% 120% at 50% 115%, #10030f 0%, rgba(16,3,15,0) 55%),
      radial-gradient(100% 100% at 50% 40%, var(--aubergine-1) 0%, var(--aubergine-2) 60%, var(--aubergine-3) 100%);
    box-shadow:
      0 40px 80px rgba(0,0,0,.65),
      0 6px 24px rgba(0,0,0,.5),
      inset 0 2px 6px rgba(255,190,235,.18),
      inset 0 -18px 40px rgba(0,0,0,.55);
    border:1px solid rgba(255,200,240,.10);
  }
  /* тонкий обідок-безель */
  .calc::before{
    content:"";
    position:absolute;
    inset:12px;
    border-radius:50%;
    border:1px solid rgba(255,200,240,.08);
    pointer-events:none;
  }

  /* ── Дисплей ── */
  .screen{
    width:78%;
    margin-bottom:14px;
    padding:12px 18px 10px;
    border-radius:22px;
    text-align:right;
    background:
      linear-gradient(180deg, rgba(10,2,12,.92), rgba(30,8,34,.92));
    box-shadow:
      inset 0 2px 10px rgba(0,0,0,.8),
      inset 0 -1px 0 rgba(255,190,235,.10),
      0 1px 0 rgba(255,190,235,.06);
    overflow:hidden;
  }
  .screen .expr{
    min-height:18px;
    font-size:15px;
    letter-spacing:-.5px;
    color:rgba(247,233,242,.45);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .screen .out{
    font-size:38px;
    font-weight:700;
    letter-spacing:-2px;             /* «стиснуті» цифри */
    color:var(--cream);
    text-shadow:0 1px 0 rgba(0,0,0,.6), 0 0 14px rgba(210,120,200,.25);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    line-height:1.05;
  }

  /* ── Мозаїка трикутників ── */
  .pad{display:flex;flex-direction:column;align-items:center}
  .row{display:flex;justify-content:center}
  .row + .row{margin-top:6px}          /* горизонтальний шов між рядами */

  .tri{
    position:relative;
    width:var(--w);
    height:var(--h);
    border:0;
    background:transparent;
    cursor:pointer;
    padding:0;
    filter:drop-shadow(0 4px 5px rgba(0,0,0,.45));
    transition:transform .07s ease, filter .07s ease;
  }
  /* трикутники «наїжджають» один на одного на пів-ширини й переплітаються */
  .row .tri + .tri{margin-left:calc(var(--w) / -2)}

  /* дивляться вгору (парні цифри) */
  .tri.up{clip-path:polygon(50% 5%, 96% 95%, 4% 95%)}
  /* дивляться вниз (непарні цифри) */
  .tri.down{clip-path:polygon(4% 5%, 96% 5%, 50% 95%)}

  /* Оксамитова поверхня кнопок */
  .tri::after{
    content:"";
    position:absolute;
    inset:0;
    clip-path:inherit;
  }
  /* Оксамит для ЦИФР — фіолетовий плюш */
  .tri.digit::after{
    background:
      radial-gradient(80% 55% at 50% 15%, rgba(255,190,230,.32), rgba(255,190,230,0) 55%),
      radial-gradient(120% 120% at 50% 125%, rgba(0,0,0,.6), rgba(0,0,0,0) 60%),
      linear-gradient(180deg, #833a70 0%, #5a2650 45%, #3c1838 100%);
  }
  /* Оксамит для ЗНАКІВ — теплий золотисто-винний плюш */
  .tri.op::after{
    background:
      radial-gradient(80% 55% at 50% 15%, rgba(255,232,200,.4), rgba(255,232,200,0) 55%),
      radial-gradient(120% 120% at 50% 125%, rgba(20,4,0,.6), rgba(20,4,0,0) 60%),
      linear-gradient(180deg, #b9793b 0%, #8a4f24 48%, #532c13 100%);
  }
  /* Кнопка «=» — найяскравіша */
  .tri.equal::after{
    background:
      radial-gradient(80% 55% at 50% 15%, rgba(255,244,220,.55), rgba(255,244,220,0) 55%),
      radial-gradient(120% 120% at 50% 125%, rgba(30,6,0,.55), rgba(30,6,0,0) 60%),
      linear-gradient(180deg, #e0a24a 0%, #b06e2a 50%, #7a4415 100%);
  }

  /* Підпис кнопки */
  .tri .lbl{
    position:absolute;
    left:0;right:0;
    z-index:2;
    text-align:center;
    font-weight:700;
    font-size:22px;
    letter-spacing:-1.5px;            /* «стиснуті» знаки/цифри */
    pointer-events:none;
    text-shadow:0 1px 1px rgba(0,0,0,.55);
  }
  .tri.digit .lbl{color:var(--cream)}
  .tri.op .lbl,.tri.equal .lbl{color:var(--gold)}
  /* центр ваги трикутника різний — тому підпис зсунуто */
  .tri.up   .lbl{top:52%}
  .tri.down .lbl{top:14%}

  .tri:hover{filter:drop-shadow(0 6px 8px rgba(0,0,0,.5)) brightness(1.08)}
  .tri:active{transform:translateY(2px) scale(.96);filter:drop-shadow(0 2px 3px rgba(0,0,0,.5)) brightness(.94)}
  .tri.flash::after{filter:brightness(1.35)}

  @media(max-width:540px){
    :root{--w:60px;--h:53px}
    .calc{width:380px;height:380px;padding:24px 14px}
    .screen .out{font-size:30px}
    .tri .lbl{font-size:17px}
  }

  /* ── Котик, що ходить по колу ── */
  .cat{
    position:absolute;
    top:0;left:0;
    z-index:6;
    pointer-events:none;
    filter:drop-shadow(0 5px 6px rgba(0,0,0,.5));
    will-change:transform;
  }
  .cat-inner{
    position:relative;
    width:92px;height:92px;
    transform:translate(-50%,-50%);
  }
  .cat svg{width:92px;height:92px;display:block;overflow:visible}
  .cat-bob{transform-origin:50% 92%;animation:catBob .5s ease-in-out infinite}
  .cat-inner.celebrate .cat-bob{animation:none}

  @keyframes catBob{
    0%,100%{transform:translateY(0) rotate(-2.5deg)}
    50%    {transform:translateY(-4px) rotate(2.5deg)}
  }

  .cat-tail{transform-box:fill-box;transform-origin:12% 88%;animation:tailSway 1.3s ease-in-out infinite}
  @keyframes tailSway{0%,100%{transform:rotate(-12deg)}50%{transform:rotate(12deg)}}

  .cat-arm{transform-box:fill-box;transform-origin:50% 96%;animation:pawIdle 2.4s ease-in-out infinite}
  @keyframes pawIdle{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(6deg)}}

  /* Святкування: розвернутися (оберт) і махати лапкою */
  .cat-inner.celebrate{animation:catSpin .66s ease-in-out}
  @keyframes catSpin{
    0%  {transform:translate(-50%,-50%) rotate(0)     scale(1)}
    45% {transform:translate(-50%,-72%) rotate(200deg) scale(1.1)}
    100%{transform:translate(-50%,-50%) rotate(360deg) scale(1)}
  }
  .cat-inner.celebrate .cat-arm{animation:pawWave .32s ease-in-out .52s 5}
  @keyframes pawWave{0%,100%{transform:rotate(-22deg)}50%{transform:rotate(24deg)}}

  .eyes-happy{opacity:0}
  .cat-inner.celebrate .eyes-open{opacity:0}
  .cat-inner.celebrate .eyes-happy{opacity:1}

  .cat-spark{opacity:0}
  .cat-inner.celebrate .cat-spark{animation:catSpark 1.5s ease-in-out .45s 1}
  @keyframes catSpark{0%,100%{opacity:0;transform:scale(.4)}30%,70%{opacity:1;transform:scale(1)}}

  @media(prefers-reduced-motion:reduce){
    .cat-bob,.cat-tail,.cat-arm{animation:none}
    .cat-inner.celebrate{animation:none}
  }
</style>
</head>
<body>
  <div class="calc" role="application" aria-label="Круглий баклажановий калькулятор">
    <div class="screen">
      <div class="expr" id="expr">&nbsp;</div>
      <div class="out"  id="out">0</div>
    </div>
    <div class="pad" id="pad"></div>

    <!-- Котик, що ходить по колу -->
    <div class="cat" id="cat" aria-hidden="true">
      <div class="cat-inner" id="catInner">
        <div class="cat-bob">
          <svg viewBox="0 0 100 100">
            <!-- тінь -->
            <ellipse cx="50" cy="93" rx="20" ry="4" fill="rgba(0,0,0,.22)"/>

            <!-- хвіст -->
            <path class="cat-tail" d="M68 80 q24 4 22 -20 q-2 -13 -11 -11 q7 4 5 13 q-2 11 -18 9 z" fill="#c7cad6"/>

            <!-- тіло + ніжки -->
            <ellipse cx="50" cy="74" rx="23" ry="19" fill="#edeef3"/>
            <ellipse cx="30" cy="74" rx="6" ry="8" fill="#edeef3"/>
            <ellipse cx="41" cy="90" rx="8" ry="5.5" fill="#edeef3"/>
            <ellipse cx="59" cy="90" rx="8" ry="5.5" fill="#edeef3"/>
            <ellipse cx="41" cy="91" rx="3" ry="1.8" fill="#ff9bb3"/>
            <ellipse cx="59" cy="91" rx="3" ry="1.8" fill="#ff9bb3"/>

            <!-- голова -->
            <path d="M25 30 L29 7 L46 24 Z" fill="#c7cad6"/>
            <path d="M75 30 L71 7 L54 24 Z" fill="#c7cad6"/>
            <path d="M30 26 L32 14 L41 24 Z" fill="#ff9bb3"/>
            <path d="M70 26 L68 14 L59 24 Z" fill="#ff9bb3"/>
            <ellipse cx="50" cy="40" rx="30" ry="27" fill="#edeef3"/>
            <path d="M21 36 a30 27 0 0 1 58 0 q-29 -15 -58 0 z" fill="#c7cad6" opacity=".85"/>

            <!-- очі (відкриті) -->
            <g class="eyes-open">
              <ellipse cx="39" cy="43" rx="4.5" ry="6" fill="#2c2740"/>
              <ellipse cx="61" cy="43" rx="4.5" ry="6" fill="#2c2740"/>
              <circle cx="40.6" cy="41" r="1.4" fill="#fff"/>
              <circle cx="62.6" cy="41" r="1.4" fill="#fff"/>
            </g>
            <!-- очі (щасливі) -->
            <g class="eyes-happy" fill="none" stroke="#2c2740" stroke-width="2.4" stroke-linecap="round">
              <path d="M34 45 q5 -6 10 0"/>
              <path d="M56 45 q5 -6 10 0"/>
            </g>

            <!-- рожеві щічки -->
            <ellipse cx="29" cy="50" rx="7" ry="4.5" fill="#ff9bb3" opacity=".8"/>
            <ellipse cx="71" cy="50" rx="7" ry="4.5" fill="#ff9bb3" opacity=".8"/>

            <!-- носик + ротик -->
            <path d="M46.5 48 L53.5 48 L50 52 Z" fill="#ff7fa3"/>
            <path d="M50 52 q-3 4 -6.5 1.5 M50 52 q3 4 6.5 1.5" fill="none" stroke="#c99" stroke-width="1.4" stroke-linecap="round"/>

            <!-- вусики -->
            <g stroke="#c7cad6" stroke-width="1.2" stroke-linecap="round">
              <path d="M27 50 L13 47"/><path d="M27 54 L13 56"/>
              <path d="M73 50 L87 47"/><path d="M73 54 L87 56"/>
            </g>

            <!-- нашийник + золотий дзвіночок -->
            <path d="M33 61 q17 11 34 0" fill="none" stroke="#b06e2a" stroke-width="3"/>
            <circle cx="50" cy="66" r="4.2" fill="#f0c14b" stroke="#b8892b" stroke-width="1"/>
            <circle cx="50" cy="67" r="1" fill="#7a4415"/>

            <!-- лапка, що махає -->
            <g class="cat-arm">
              <rect x="76" y="38" width="9" height="30" rx="4.5" fill="#edeef3"/>
              <circle cx="80.5" cy="36" r="6.5" fill="#edeef3"/>
              <ellipse cx="80.5" cy="35" rx="2.6" ry="1.7" fill="#ff9bb3"/>
            </g>

            <!-- іскорки -->
            <g class="cat-spark" fill="#ffe6c2">
              <path d="M11 20 l1.6 4.2 4.2 1.6 -4.2 1.6 -1.6 4.2 -1.6 -4.2 -4.2 -1.6 4.2 -1.6 z"/>
              <path d="M88 15 l1.2 3.2 3.2 1.2 -3.2 1.2 -1.2 3.2 -1.2 -3.2 -3.2 -1.2 3.2 -1.2 z"/>
            </g>
          </svg>
        </div>
      </div>
    </div>
  </div>

<script>
(function(){
  "use strict";

  /* Розкладка кнопок.
     Кожен рядок — п'ять трикутників, орієнтація чергується: вгору,вниз,вгору,вниз,вгору.
     Правило: ПАРНІ цифри дивляться ВГОРУ, НЕПАРНІ — ВНИЗ. Знаки відрізняються КОЛЬОРОМ. */
  const LAYOUT = [
    ["0","1","2","3","4"],
    ["6","5","8","7","⌫"],
    ["C","9","÷","×","+"],
    ["−","=",".","%","±"]
  ];

  const OPS = new Set(["÷","×","−","+","%","±","C","⌫","="]);

  const pad = document.getElementById("pad");
  LAYOUT.forEach(row=>{
    const r = document.createElement("div");
    r.className = "row";
    row.forEach((key,i)=>{
      const dir = (i % 2 === 0) ? "up" : "down";
      const isDigit = /[0-9]/.test(key) || key === ".";

      // Перевірка правила парності для цифр
      if(/[0-9]/.test(key)){
        const wantUp = (Number(key) % 2 === 0);
        if((wantUp && dir!=="up") || (!wantUp && dir!=="down")){
          console.warn("Порушено правило парності для",key);
        }
      }

      const b = document.createElement("button");
      b.className = "tri " + dir + " " + (isDigit ? "digit" : "op") + (key==="=" ? " equal" : "");
      b.dataset.key = key;
      b.setAttribute("aria-label", key);
      const s = document.createElement("span");
      s.className = "lbl";
      s.textContent = key;
      b.appendChild(s);
      r.appendChild(b);
    });
    pad.appendChild(r);
  });

  /* ── Логіка калькулятора ── */
  const outEl  = document.getElementById("out");
  const exprEl = document.getElementById("expr");

  let current = "0";   // те, що набирається
  let stored  = null;  // збережений операнд
  let op      = null;  // очікувана дія
  let fresh   = true;  // наступна цифра починає нове число

  const SYM = {"÷":"÷","×":"×","−":"−","+":"+"};

  function fmt(n){
    if(!isFinite(n)) return "Помилка";
    let s = Number(n.toPrecision(12)).toString();
    return s;
  }

  function render(){
    outEl.textContent = current;
    let e = "";
    if(stored !== null && op) e = fmt(stored) + " " + op + " ";
    exprEl.innerHTML = e ? e : "&nbsp;";
  }

  function inputDigit(d){
    if(fresh){ current = (d==="0") ? "0" : d; fresh=false; }
    else{
      if(current === "0" && d !== ".") current = d;
      else current += d;
    }
  }
  function inputDot(){
    if(fresh){ current="0."; fresh=false; return; }
    if(!current.includes(".")) current += ".";
  }
  function compute(a,b,o){
    a=parseFloat(a); b=parseFloat(b);
    switch(o){
      case "+": return a+b;
      case "−": return a-b;
      case "×": return a*b;
      case "÷": return b===0 ? NaN : a/b;
    }
    return b;
  }
  function setOp(o){
    if(op && !fresh){
      const res = compute(stored, current, op);
      stored = res; current = fmt(res);
    }else{
      stored = parseFloat(current);
    }
    op = o; fresh = true;
  }
  function equals(){
    if(op === null) return;
    const res = compute(stored, current, op);
    exprEl.textContent = fmt(stored) + " " + op + " " + current + " =";
    current = fmt(res);
    stored = null; op = null; fresh = true;
    outEl.textContent = current;
    if(isFinite(res)) catCelebrate();   // котик радіє правильній відповіді
  }
  function clearAll(){ current="0"; stored=null; op=null; fresh=true; }
  function backspace(){
    if(fresh) return;
    current = current.length>1 ? current.slice(0,-1) : "0";
    if(current==="-"||current==="") current="0";
  }
  function percent(){
    let v = parseFloat(current)/100;
    if(stored!==null && op) v = parseFloat(stored) * (parseFloat(current)/100);
    current = fmt(v); fresh=true;
  }
  function negate(){
    if(current==="0") return;
    current = current.startsWith("-") ? current.slice(1) : "-"+current;
  }

  function handle(key){
    if(/[0-9]/.test(key)) inputDigit(key);
    else if(key===".") inputDot();
    else if(SYM[key]) setOp(key);
    else if(key==="=") { equals(); return; }
    else if(key==="C") clearAll();
    else if(key==="⌫") backspace();
    else if(key==="%") percent();
    else if(key==="±") negate();
    render();
  }

  pad.addEventListener("click", e=>{
    const b = e.target.closest(".tri");
    if(!b) return;
    b.classList.add("flash");
    setTimeout(()=>b.classList.remove("flash"),90);
    handle(b.dataset.key);
  });

  /* Підтримка клавіатури */
  const KEYMAP = {"/":"÷","*":"×","-":"−","+":"+",".":".","%":"%",
                  "Enter":"=","=":"=","Backspace":"⌫","Escape":"C","c":"C","C":"C"};
  window.addEventListener("keydown", e=>{
    let k = e.key;
    if(/[0-9]/.test(k)){ handle(k); flashKey(k); e.preventDefault(); return; }
    if(KEYMAP[k]){ handle(KEYMAP[k]); flashKey(KEYMAP[k]); e.preventDefault(); }
  });
  function flashKey(key){
    const b = pad.querySelector('.tri[data-key="'+CSS.escape(key)+'"]');
    if(!b) return;
    b.classList.add("flash");
    setTimeout(()=>b.classList.remove("flash"),90);
  }

  /* ── Котик, що ходить по колу ── */
  const calcEl  = document.querySelector(".calc");
  const cat     = document.getElementById("cat");
  const catInner= document.getElementById("catInner");
  const TAU = Math.PI*2;
  let angle = 0;                 // 0 = вгорі, рух за годинниковою стрілкою
  let lastT = 0;
  let paused = false;
  const SPEED = TAU / 16000;     // повний оберт за 16 секунд

  function faceFor(a){ return Math.cos(a) < 0 ? "scaleX(-1)" : "scaleX(1)"; }

  function catFrame(t){
    if(!lastT) lastT = t;
    const dt = t - lastT; lastT = t;
    if(!paused){
      angle += SPEED * dt;
      if(angle > TAU) angle -= TAU;
    }
    const R  = calcEl.clientWidth/2 - 20;   // ходить по обідку кола
    const cx = calcEl.clientWidth/2;
    const cy = calcEl.clientHeight/2;
    const x  = cx + R * Math.sin(angle);
    const y  = cy - R * Math.cos(angle);
    cat.style.transform = "translate(" + x + "px," + y + "px)";
    if(!paused){
      catInner.style.transform = "translate(-50%,-50%) " + faceFor(angle);
    }
    requestAnimationFrame(catFrame);
  }
  requestAnimationFrame(catFrame);

  let celebrateTimer = null;
  function catCelebrate(){
    paused = true;
    // повернутися лицем до центру кола
    const faceCenter = Math.sin(angle) > 0 ? "scaleX(-1)" : "scaleX(1)";
    catInner.classList.remove("celebrate");
    void catInner.offsetWidth;                 // перезапуск анімації
    catInner.style.transform = "translate(-50%,-50%) " + faceCenter;
    catInner.classList.add("celebrate");
    clearTimeout(celebrateTimer);
    celebrateTimer = setTimeout(function(){
      catInner.classList.remove("celebrate");
      lastT = 0;                               // без стрибка часу
      paused = false;
    }, 2050);
  }

  render();
})();
</script>
</body>
</html>
