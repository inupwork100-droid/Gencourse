<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Круглий баклажановий калькулятор</title>
<style>
  :root{
    /* Баклажановий — колір основи */
    --aubergine-1:#3a1440;
    --aubergine-2:#26082c;
    --aubergine-3:#140316;
    --grout:#1c0620;            /* «шов» між кнопками */
    --cream:#f7e9f2;            /* колір цифр */
    --gold:#ffe6c2;             /* колір знаків */

    --w:88px;                   /* ширина трикутника */
    --h:77px;                   /* висота трикутника */
  }

  *{box-sizing:border-box;margin:0;padding:0}

  html,body{height:100%}
  body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
      radial-gradient(120% 120% at 30% 10%, #2a0e30 0%, #12040f 55%, #060207 100%);
    font-family:"Arial Narrow","Helvetica Neue",Arial,sans-serif;
    padding:24px;
    -webkit-font-smoothing:antialiased;
  }

  /* ── Кругле тіло калькулятора ── */
  .calc{
    position:relative;
    width:500px;
    height:500px;
    max-width:92vw;
    max-height:92vw;
    border-radius:50%;
    padding:34px 22px 30px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    /* Баклажанова оксамитова основа */
    background:
      radial-gradient(70% 60% at 50% 20%, rgba(150,60,150,.28), rgba(150,60,150,0) 60%),
      radial-gradient(120% 120% at 50% 115%, #10030f 0%, rgba(16,3,15,0) 55%),
      radial-gradient(100% 100% at 50% 40%, var(--aubergine-1) 0%, var(--aubergine-2) 60%, var(--aubergine-3) 100%);
    box-shadow:
      0 40px 80px rgba(0,0,0,.65),
      0 6px 24px rgba(0,0,0,.5),
      inset 0 2px 6px rgba(255,190,235,.18),
      inset 0 -18px 40px rgba(0,0,0,.55);
    border:1px solid rgba(255,200,240,.10);
  }
  /* тонкий обідок-безель */
  .calc::before{
    content:"";
    position:absolute;
    inset:12px;
    border-radius:50%;
    border:1px solid rgba(255,200,240,.08);
    pointer-events:none;
  }

  /* ── Дисплей ── */
  .screen{
    width:78%;
    margin-bottom:14px;
    padding:12px 18px 10px;
    border-radius:22px;
    text-align:right;
    background:
      linear-gradient(180deg, rgba(10,2,12,.92), rgba(30,8,34,.92));
    box-shadow:
      inset 0 2px 10px rgba(0,0,0,.8),
      inset 0 -1px 0 rgba(255,190,235,.10),
      0 1px 0 rgba(255,190,235,.06);
    overflow:hidden;
  }
  .screen .expr{
    min-height:18px;
    font-size:15px;
    letter-spacing:-.5px;
    color:rgba(247,233,242,.45);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .screen .out{
    font-size:38px;
    font-weight:700;
    letter-spacing:-2px;             /* «стиснуті» цифри */
    color:var(--cream);
    text-shadow:0 1px 0 rgba(0,0,0,.6), 0 0 14px rgba(210,120,200,.25);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    line-height:1.05;
  }

  /* ── Мозаїка трикутників ── */
  .pad{display:flex;flex-direction:column;align-items:center}
  .row{display:flex;justify-content:center}
  .row + .row{margin-top:6px}          /* горизонтальний шов між рядами */

  .tri{
    position:relative;
    width:var(--w);
    height:var(--h);
    border:0;
    background:transparent;
    cursor:pointer;
    padding:0;
    filter:drop-shadow(0 4px 5px rgba(0,0,0,.45));
    transition:transform .07s ease, filter .07s ease;
  }
  /* трикутники «наїжджають» один на одного на пів-ширини й переплітаються */
  .row .tri + .tri{margin-left:calc(var(--w) / -2)}

  /* дивляться вгору (парні цифри) */
  .tri.up{clip-path:polygon(50% 5%, 96% 95%, 4% 95%)}
  /* дивляться вниз (непарні цифри) */
  .tri.down{clip-path:polygon(4% 5%, 96% 5%, 50% 95%)}

  /* Оксамитова поверхня кнопок */
  .tri::after{
    content:"";
    position:absolute;
    inset:0;
    clip-path:inherit;
  }
  /* Оксамит для ЦИФР — фіолетовий плюш */
  .tri.digit::after{
    background:
      radial-gradient(80% 55% at 50% 15%, rgba(255,190,230,.32), rgba(255,190,230,0) 55%),
      radial-gradient(120% 120% at 50% 125%, rgba(0,0,0,.6), rgba(0,0,0,0) 60%),
      linear-gradient(180deg, #833a70 0%, #5a2650 45%, #3c1838 100%);
  }
  /* Оксамит для ЗНАКІВ — теплий золотисто-винний плюш */
  .tri.op::after{
    background:
      radial-gradient(80% 55% at 50% 15%, rgba(255,232,200,.4), rgba(255,232,200,0) 55%),
      radial-gradient(120% 120% at 50% 125%, rgba(20,4,0,.6), rgba(20,4,0,0) 60%),
      linear-gradient(180deg, #b9793b 0%, #8a4f24 48%, #532c13 100%);
  }
  /* Кнопка «=» — найяскравіша */
  .tri.equal::after{
    background:
      radial-gradient(80% 55% at 50% 15%, rgba(255,244,220,.55), rgba(255,244,220,0) 55%),
      radial-gradient(120% 120% at 50% 125%, rgba(30,6,0,.55), rgba(30,6,0,0) 60%),
      linear-gradient(180deg, #e0a24a 0%, #b06e2a 50%, #7a4415 100%);
  }

  /* Підпис кнопки */
  .tri .lbl{
    position:absolute;
    left:0;right:0;
    z-index:2;
    text-align:center;
    font-weight:700;
    font-size:22px;
    letter-spacing:-1.5px;            /* «стиснуті» знаки/цифри */
    pointer-events:none;
    text-shadow:0 1px 1px rgba(0,0,0,.55);
  }
  .tri.digit .lbl{color:var(--cream)}
  .tri.op .lbl,.tri.equal .lbl{color:var(--gold)}
  /* центр ваги трикутника різний — тому підпис зсунуто */
  .tri.up   .lbl{top:52%}
  .tri.down .lbl{top:14%}

  .tri:hover{filter:drop-shadow(0 6px 8px rgba(0,0,0,.5)) brightness(1.08)}
  .tri:active{transform:translateY(2px) scale(.96);filter:drop-shadow(0 2px 3px rgba(0,0,0,.5)) brightness(.94)}
  .tri.flash::after{filter:brightness(1.35)}

  @media(max-width:540px){
    :root{--w:60px;--h:53px}
    .calc{width:380px;height:380px;padding:24px 14px}
    .screen .out{font-size:30px}
    .tri .lbl{font-size:17px}
  }

  /* ── Котик у чорному мультстилі ── */
  .cat{
    --cat-ink:#141019;
    --cat-face:#f6ecf3;
    --cat-cheek:#ff9bb3;
    position:absolute;
    top:0;left:0;
    z-index:6;
    pointer-events:none;
    /* світлий контур, щоб чорний котик читався на темному фоні */
    filter:
      drop-shadow(0 0 1px var(--cat-face))
      drop-shadow(0 0 2px rgba(246,236,243,.7))
      drop-shadow(0 5px 6px rgba(0,0,0,.55));
    will-change:transform;
  }
  .cat-inner{position:relative;width:108px;height:108px;transform:translate(-50%,-50%)}
  .pose{position:absolute;inset:0;opacity:0;visibility:hidden}
  .pose.on{opacity:1;visibility:visible}
  .pose svg{width:108px;height:108px;display:block;overflow:visible}

  /* ходить — похитування + крок + хвіст */
  .pose-walk.on{transform-origin:50% 86%;animation:catWalk .42s ease-in-out infinite}
  @keyframes catWalk{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-4px) rotate(3deg)}}
  .pose-walk .w-paw{transform-box:fill-box;transform-origin:64% 8%;animation:catStep .42s ease-in-out infinite}
  @keyframes catStep{0%,100%{transform:rotate(-20deg)}50%{transform:rotate(16deg)}}
  .pose-walk .w-tail{transform-box:fill-box;transform-origin:20% 92%;animation:catTail 1.2s ease-in-out infinite}
  .pose-sit .s-tail,.pose-wave .s-tail{transform-box:fill-box;transform-origin:14% 88%;animation:catTail 1.5s ease-in-out infinite}
  @keyframes catTail{0%,100%{transform:rotate(-10deg)}50%{transform:rotate(13deg)}}

  /* сидить — легке «дихання» */
  .pose-sit.on{transform-origin:50% 92%;animation:catBreath 2.6s ease-in-out infinite}
  @keyframes catBreath{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}

  /* махає лапкою */
  .pose-wave.on .wave-arm{transform-box:fill-box;transform-origin:58% 92%;animation:catWave .32s ease-in-out infinite}
  @keyframes catWave{0%,100%{transform:rotate(-24deg)}50%{transform:rotate(20deg)}}
  .pose-wave.on .marks{animation:catMarks .7s ease-in-out infinite}
  @keyframes catMarks{0%,100%{opacity:.2}50%{opacity:1}}

  /* визирає збоку */
  .pose-peek.on{animation:catPeekIn .5s ease-out both}
  @keyframes catPeekIn{0%{transform:translateX(16px) scale(.9);opacity:0}100%{transform:translateX(0) scale(1);opacity:1}}
  .pose-peek .peek-paw{transform-box:fill-box;transform-origin:50% 100%;animation:catPeekTap 1.3s ease-in-out infinite}
  @keyframes catPeekTap{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}

  @media(prefers-reduced-motion:reduce){
    .pose-walk.on,.pose-sit.on,.pose-walk .w-paw,.pose-walk .w-tail,
    .pose-sit .s-tail,.pose-wave .s-tail,.pose-wave.on .wave-arm,
    .pose-wave.on .marks,.pose-peek.on,.pose-peek .peek-paw{animation:none}
  }
</style>
</head>
<body>
  <div class="calc" role="application" aria-label="Круглий баклажановий калькулятор">
    <div class="screen">

    </div>
    <div class="pad" id="pad"></div>

    <!-- Котик у чорному стилі: визирає / ходить / сидить / махає -->
    <div class="cat" id="cat" aria-hidden="true">

        <!-- ВИЗИРАЄ ЗБОКУ (на старті) -->

        <!-- ХОДИТЬ -->

              <path class="w-tail" d="M76 66 q6 -22 -8 -30 q-8 -4 -6 4 q10 -1 8 10 q-2 12 4 18 z"/>
              <ellipse cx="58" cy="70" rx="24" ry="16" transform="rotate(-8 58 70)"/>
              <ellipse cx="52" cy="90" rx="7" ry="5.5"/>
              <ellipse cx="70" cy="86" rx="7" ry="5.5"/>
              <path d="M28 34 L30 10 L48 28 Z"/>

            </g>
            <ellipse cx="32" cy="49" rx="5.5" ry="3.6" fill="var(--cat-cheek)"/>

            <g class="marks" stroke="var(--cat-face)" stroke-width="2.4" stroke-linecap="round" opacity=".85">

        <!-- СИДИТЬ -->
        <div class="pose pose-sit" id="poseSit">
          <svg viewBox="0 0 108 108">

        <!-- МАХАЄ ЛАПКОЮ (правильна відповідь) -->
        <div class="pose pose-wave" id="poseWave">

<script>
(function(){
  "use strict";

  /* Розкладка кнопок.
     Кожен рядок — п'ять трикутників, орієнтація чергується: вгору,вниз,вгору,вниз,вгору.
     Правило: ПАРНІ цифри дивляться ВГОРУ, НЕПАРНІ — ВНИЗ. Знаки відрізняються КОЛЬОРОМ. */
  const LAYOUT = [
    ["0","1","2","3","4"],
    ["6","5","8","7","⌫"],
    ["C","9","÷","×","+"],
    ["−","=",".","%","±"]
  ];

  const OPS = new Set(["÷","×","−","+","%","±","C","⌫","="]);

  const pad = document.getElementById("pad");
  LAYOUT.forEach(row=>{
    const r = document.createElement("div");
    r.className = "row";
    row.forEach((key,i)=>{
      const dir = (i % 2 === 0) ? "up" : "down";
      const isDigit = /[0-9]/.test(key) || key === ".";

      // Перевірка правила парності для цифр
      if(/[0-9]/.test(key)){
        const wantUp = (Number(key) % 2 === 0);
        if((wantUp && dir!=="up") || (!wantUp && dir!=="down")){
          console.warn("Порушено правило парності для",key);
        }
      }

      const b = document.createElement("button");
      b.className = "tri " + dir + " " + (isDigit ? "digit" : "op") + (key==="=" ? " equal" : "");
      b.dataset.key = key;
      b.setAttribute("aria-label", key);
      const s = document.createElement("span");
      s.className = "lbl";
      s.textContent = key;
      b.appendChild(s);
      r.appendChild(b);
    });
    pad.appendChild(r);
  });

  /* ── Логіка калькулятора ── */
  const outEl  = document.getElementById("out");
  const exprEl = document.getElementById("expr");

  let current = "0";   // те, що набирається
  let stored  = null;  // збережений операнд
  let op      = null;  // очікувана дія
  let fresh   = true;  // наступна цифра починає нове число

  const SYM = {"÷":"÷","×":"×","−":"−","+":"+"};

  function fmt(n){
    if(!isFinite(n)) return "Помилка";
    let s = Number(n.toPrecision(12)).toString();
    return s;
  }

  function render(){
    outEl.textContent = current;
    let e = "";
    if(stored !== null && op) e = fmt(stored) + " " + op + " ";
    exprEl.innerHTML = e ? e : "&nbsp;";
  }

  function inputDigit(d){
    if(fresh){ current = (d==="0") ? "0" : d; fresh=false; }
    else{
      if(current === "0" && d !== ".") current = d;
      else current += d;
    }
  }
  function inputDot(){
    if(fresh){ current="0."; fresh=false; return; }
    if(!current.includes(".")) current += ".";
  }
  function compute(a,b,o){
    a=parseFloat(a); b=parseFloat(b);
    switch(o){
      case "+": return a+b;
      case "−": return a-b;
      case "×": return a*b;
      case "÷": return b===0 ? NaN : a/b;
    }
    return b;
  }
  function setOp(o){
    if(op && !fresh){
      const res = compute(stored, current, op);
      stored = res; current = fmt(res);
    }else{
      stored = parseFloat(current);
    }
    op = o; fresh = true;
  }
  function equals(){
    if(op === null) return;
    const res = compute(stored, current, op);
    exprEl.textContent = fmt(stored) + " " + op + " " + current + " =";
    current = fmt(res);
    stored = null; op = null; fresh = true;
    outEl.textContent = current;
    if(isFinite(res)) catCelebrate();   // котик радіє правильній відповіді
  }
  function clearAll(){ current="0"; stored=null; op=null; fresh=true; }
  function backspace(){
    if(fresh) return;
    current = current.length>1 ? current.slice(0,-1) : "0";
    if(current==="-"||current==="") current="0";
  }
  function percent(){
    let v = parseFloat(current)/100;
    if(stored!==null && op) v = parseFloat(stored) * (parseFloat(current)/100);
    current = fmt(v); fresh=true;
  }
  function negate(){
    if(current==="0") return;
    current = current.startsWith("-") ? current.slice(1) : "-"+current;
  }

  function handle(key){
    if(/[0-9]/.test(key)) inputDigit(key);
    else if(key===".") inputDot();
    else if(SYM[key]) setOp(key);
    else if(key==="=") { equals(); return; }
    else if(key==="C") clearAll();
    else if(key==="⌫") backspace();
    else if(key==="%") percent();
    else if(key==="±") negate();
    render();
  }

  pad.addEventListener("click", e=>{
    const b = e.target.closest(".tri");
    if(!b) return;
    b.classList.add("flash");
    setTimeout(()=>b.classList.remove("flash"),90);
    handle(b.dataset.key);
  });

  /* Підтримка клавіатури */
  const KEYMAP = {"/":"÷","*":"×","-":"−","+":"+",".":".","%":"%",
                  "Enter":"=","=":"=","Backspace":"⌫","Escape":"C","c":"C","C":"C"};
  window.addEventListener("keydown", e=>{
    let k = e.key;
    if(/[0-9]/.test(k)){ handle(k); flashKey(k); e.preventDefault(); return; }
    if(KEYMAP[k]){ handle(KEYMAP[k]); flashKey(KEYMAP[k]); e.preventDefault(); }
  });
  function flashKey(key){
    const b = pad.querySelector('.tri[data-key="'+CSS.escape(key)+'"]');
    if(!b) return;
    b.classList.add("flash");
    setTimeout(()=>b.classList.remove("flash"),90);
  }

  /* ── Котик: визирає → ходить ↔ сидить, махає на «=» ── */
  const calcEl  = document.querySelector(".calc");
  const cat     = document.getElementById("cat");
  const catInner= document.getElementById("catInner");
  const poses = {
    peek: document.getElementById("posePeek"),
    walk: document.getElementById("poseWalk"),
    sit:  document.getElementById("poseSit"),
    wave: document.getElementById("poseWave")
  };
  const TAU = Math.PI*2;
  let angle = Math.PI/2;         // 0 = вгорі; π/2 = правий бік
  let lastT = 0;
  let orbiting = false;          // рух по колу лише коли «ходить»
  let timer = null;

  function showPose(name){
    for(const k in poses) poses[k].classList.toggle("on", k===name);
  }
  // під час ходьби дивиться в бік руху; у спокої — до центру кола
  function faceWalk(a){   return Math.cos(a) < 0 ? "scaleX(-1)" : "scaleX(1)"; }
  function faceCenter(a){ return Math.sin(a) > 0 ? "scaleX(-1)" : "scaleX(1)"; }

  function place(){
    const R  = calcEl.clientWidth/2 - 14;
    const cx = calcEl.clientWidth/2, cy = calcEl.clientHeight/2;
    cat.style.transform = "translate(" + (cx + R*Math.sin(angle)) + "px," + (cy - R*Math.cos(angle)) + "px)";
  }

  function frame(t){
    if(!lastT) lastT = t;
    const dt = t - lastT; lastT = t;
    if(orbiting){
      angle += (TAU/17000) * dt;
      if(angle > TAU) angle -= TAU;
      place();
      catInner.style.transform = "translate(-50%,-50%) " + faceWalk(angle);
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  const rand = (a,b)=> a + Math.random()*(b-a);

  function goPeek(){
    orbiting = false;
    angle = Math.PI/2;                                  // правий бік калькулятора
    place();
    catInner.style.transform = "translate(-50%,-50%) scaleX(1)";  // малюнок вже дивиться до центру
    showPose("peek");
    clearTimeout(timer); timer = setTimeout(goWalk, 2800);
  }
  function goWalk(){
    orbiting = true;
    showPose("walk");
    clearTimeout(timer); timer = setTimeout(goSit, rand(4200, 7000));
  }
  function goSit(){
    orbiting = false;
    catInner.style.transform = "translate(-50%,-50%) " + faceCenter(angle);
    showPose("sit");
    clearTimeout(timer); timer = setTimeout(goWalk, rand(2600, 4600));
  }
  function catCelebrate(){                               // виклик при правильній відповіді
    orbiting = false;
    catInner.style.transform = "translate(-50%,-50%) " + faceCenter(angle);
    showPose("wave");
    clearTimeout(timer); timer = setTimeout(goWalk, 2300);
  }

  goPeek();

  render();
})();
</script>
</body>
</html>
